<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EvalúaT · Escáner Integral · UCV 2026</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
:root{
  --rojo:#C8102E; --rojo-light:#FDECEA; --rojo-mid:#F5A3AE; --rojo-dark:#A00D24;
  --azul:#003087; --azul-light:#E8EDF5; --azul-mid:#7A9CC4;
  --gris:#6B7280; --gris-claro:#F5F6F7; --gris-borde:#E4E6E8; --gris-texto:#374151;
  --blanco:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--gris-claro);font-family:'Inter',sans-serif;color:var(--gris-texto);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px;}
.app{width:100%;max-width:750px;display:flex;flex-direction:column;gap:16px;}

/* HEADER */
.header{background:var(--blanco);border:0.5px solid var(--gris-borde);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.03);}
.header-top{height:4px;background:var(--rojo);}
.header-body{padding:16px 20px;display:flex;align-items:center;gap:14px;}
.logo{width:42px;height:42px;border-radius:12px;background:var(--rojo);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.brand-name{font-size:22px;font-weight:600;color:var(--azul);letter-spacing:-0.5px;line-height:1;}
.brand-name span{color:var(--rojo);}
.brand-full{font-size:11px;color:var(--gris);margin-top:3px;line-height:1.4;}
.badge{margin-left:auto;background:var(--rojo-light);color:var(--rojo);font-size:10px;padding:4px 10px;border-radius:99px;font-weight:600;white-space:nowrap;border:0.5px solid var(--rojo-mid);}

/* NOTA */
.notice{background:var(--azul-light);border:0.5px solid var(--azul-mid);border-left:3px solid var(--azul);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--gris-texto);line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.notice svg{width:18px;height:18px;stroke:var(--azul);flex-shrink:0;margin-top:2px;}

/* FORMULARIO */
.input-section{background:var(--blanco);border:0.5px solid var(--gris-borde);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,0.03);}
.input-label{font-size:14px;font-weight:600;color:var(--azul);display:flex;justify-content:space-between;align-items:baseline;}
.input-label span{font-size:12px;font-weight:400;color:var(--gris);}
.ta-wrap{display:flex;flex-direction:column;gap:10px;}
.field-input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--gris-borde);background:var(--gris-claro);font-family:'Inter',sans-serif;font-size:13px;outline:none;color:var(--gris-texto);}
.field-input:focus{border-color:var(--rojo-mid);background:var(--blanco);}
textarea.field-input{height:320px;resize:vertical;line-height:1.6;}
.btn-submit{width:100%;padding:14px;border-radius:10px;background:var(--rojo);border:none;color:#fff;font-size:14px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background 0.2s;}
.btn-submit:hover{background:var(--rojo-dark);}
.btn-submit svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;}

/* RESULTADOS */
#RESULTS_SEC{display:none;flex-direction:column;gap:14px;}
.dc{background:var(--blanco);border:0.5px solid var(--gris-borde);border-radius:14px;padding:16px 20px;box-shadow:0 2px 6px rgba(0,0,0,0.02);}
.dlbl{font-size:11px;font-weight:600;color:var(--azul);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;border-bottom:1px solid var(--gris-borde);padding-bottom:8px;}
.ex-box{background:var(--gris-claro);border:1px dashed var(--gris-borde);border-radius:8px;padding:12px;font-size:13px;color:var(--gris-texto);margin-bottom:12px;font-style:italic;line-height:1.5;}
.dg{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:8px;margin-bottom:12px;}
.di{background:var(--gris-claro);border:0.5px solid var(--gris-borde);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;}
.dk{font-size:10px;color:var(--gris);text-transform:uppercase;letter-spacing:.4px;}
