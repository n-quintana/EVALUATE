<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador Modular de Tesis</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        /* Barra de Progreso */
        .wizard-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            position: relative;
            padding: 0 50px;
        }
        .wizard-steps::before {
            content: "";
            position: absolute;
            top: 20px;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #e0e0e0;
            z-index: 1;
        }
        .step {
            text-align: center;
            position: relative;
            z-index: 2;
            flex: 1;
        }
        .step-circle {
            width: 40px;
            height: 40px;
            background: #e0e0e0;
            color: #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px auto;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .step-title {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }
        .step.active .step-circle {
            background: #b3002d;
            color: white;
            box-shadow: 0 0 10px rgba(179, 0, 45, 0.3);
        }
        .step.active .step-title {
            color: #b3002d;
        }

        /* Secciones */
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        h2 {
            color: #004b8d;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 25px;
            border-bottom: 1px solid #eef2f5;
            padding-bottom: 10px;
        }
        
        /* Campos de formulario */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }
        .field-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            background-color: #f9f9f9;
            font-size: 14px;
            color: #333;
            transition: all 0.3s;
        }
        .field-input:focus {
            outline: none;
            border-color: #004b8d;
            background-color: #fff;
        }
        textarea.field-input {
            resize: vertical;
            min-height: 200px;
            font-family: inherit;
        }

        /* Botones */
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }
        .btn {
            padding: 13px 25px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
        }
        .btn-primary {
            background-color: #b3002d;
            color: white;
            flex: 2;
        }
        .btn-primary:hover {
            background-color: #900024;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
            flex: 1;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }

        /* Pantalla de carga y Resultados */
        .loading-box {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border-left-color: #b3002d;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .result-container {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-left: 5px solid #004b8d;
            background: #f8fafc;
            border-radius: 4px;
        }
        .result-content h3 { color: #004b8d; margin-top: 20px; }
        .result-content ul { padding-left: 20px; }
        .result-content li { margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="wizard-steps">
        <div class="step active" id="step-1-indicator">
            <div class="step-circle">1</div>
